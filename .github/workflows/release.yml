name: Build và phát hành

# Chỉ phát hành khi ĐẨY TAG (hoặc bấm Run workflow thủ công).
# Push code thường lên main KHÔNG tạo release — tránh việc sửa tài liệu cũng
# đẩy ra một bản mới và làm người dùng bị nhắc cập nhật vô ích.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản cần phát hành, ví dụ 1.0.5"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build installer Windows
    runs-on: windows-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cài gói phụ thuộc
        run: npm ci

      - name: Kiểm tra cú pháp và chạy bộ test
        run: npm test

      - name: Xác định phiên bản và tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag -replace "^v", ""
          } else {
            $version = "${{ inputs.version }}".Trim() -replace "^v", ""
            $tag = "v$version"
          }

          if ($version -notmatch "^\d+\.\d+\.\d+$") {
            throw "Phiên bản '$version' không đúng dạng x.y.z (tag phải là vX.Y.Z)."
          }

          npm version $version --no-git-tag-version --allow-same-version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Sẽ phát hành $tag (version $version)"

      - name: Tạo git tag cho release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $head = git rev-parse HEAD

          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            $tagCommit = git rev-list -n 1 $tag
            if ($tagCommit -ne $head) {
              throw "Tag $tag đã tồn tại nhưng không trỏ tới commit hiện tại."
            }
            Write-Host "Tag $tag đã tồn tại đúng commit hiện tại."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $tag $head
            git push origin "refs/tags/$tag"
          }

      - name: Build bản Windows
        run: npm run build:win -- --publish never

      - name: Kiểm tra file phát hành
        id: assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = "dist/Tien-do-thi-cong-Cai-dat-$version.exe"
          $blockmap = "$installer.blockmap"
          $latest = "dist/latest.yml"
          $appUpdate = "dist/win-unpacked/resources/app-update.yml"

          $requiredFiles = @($installer, $blockmap, $latest, $appUpdate)
          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              Write-Host "Các file đang có trong dist:"
              Get-ChildItem dist -Recurse -File | ForEach-Object {
                Write-Host "- $($_.FullName) ($($_.Length) bytes)"
              }
              throw "Thiếu file phát hành: $file"
            }
          }

          # Bản sao TÊN CỐ ĐỊNH: để link tải cho người cài mới không đổi theo phiên bản.
          # https://github.com/<owner>/<repo>/releases/latest/download/Tien-do-thi-cong-Setup.exe
          $stable = "dist/Tien-do-thi-cong-Setup.exe"
          Copy-Item $installer $stable -Force

          "installer=$installer" >> $env:GITHUB_OUTPUT
          "blockmap=$blockmap" >> $env:GITHUB_OUTPUT
          "latest=$latest" >> $env:GITHUB_OUTPUT
          "stable=$stable" >> $env:GITHUB_OUTPUT

          Get-Item $installer, $blockmap, $latest | ForEach-Object {
            Write-Host "Đã tạo $($_.Name) ($($_.Length) bytes)"
          }

      - name: Upload asset lên GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $installer = "${{ steps.assets.outputs.installer }}"
          $blockmap = "${{ steps.assets.outputs.blockmap }}"
          $latest = "${{ steps.assets.outputs.latest }}"
          $stable = "${{ steps.assets.outputs.stable }}"

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $installer $blockmap $latest $stable `
              --repo $repo `
              --verify-tag `
              --title $tag `
              --notes "Phát hành $tag" `
              --latest
            if ($LASTEXITCODE -ne 0) {
              throw "Không tạo được GitHub Release $tag."
            }
          } else {
            gh release upload $tag $installer $blockmap $latest $stable --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Không upload được asset lên GitHub Release $tag."
            }
          }

      - name: Xác nhận asset release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $version = "${{ steps.version.outputs.version }}"
          $expectedAssets = @(
            "Tien-do-thi-cong-Cai-dat-$version.exe",
            "Tien-do-thi-cong-Cai-dat-$version.exe.blockmap",
            "latest.yml",
            "Tien-do-thi-cong-Setup.exe"
          )

          $release = gh release view $tag --repo $repo --json assets | ConvertFrom-Json
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $missingAssets = @($expectedAssets | Where-Object { $assetNames -notcontains $_ })

          if ($missingAssets.Count -gt 0) {
            Write-Host "Asset đang có trên release:"
            $assetNames | ForEach-Object { Write-Host "- $_" }
            throw "Release thiếu asset: $($missingAssets -join ', ')"
          }

          Write-Host "Release $tag đã có đủ asset:"
          $expectedAssets | ForEach-Object { Write-Host "- $_" }

      - name: Tóm tắt release
        shell: pwsh
        run: |
          "Đã phát hành release ${{ steps.version.outputs.tag }}" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Link tải CỐ ĐỊNH cho người cài mới (không đổi theo phiên bản):" >> $env:GITHUB_STEP_SUMMARY
          "https://github.com/${{ github.repository }}/releases/latest/download/Tien-do-thi-cong-Setup.exe" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Trang tải:" >> $env:GITHUB_STEP_SUMMARY
          "https://github.com/${{ github.repository }}/releases/latest" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem dist -File | ForEach-Object {
            "- $($_.Name)" >> $env:GITHUB_STEP_SUMMARY
          }
